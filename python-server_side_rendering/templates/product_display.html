<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product Display</title>
    </head>
    <body>
        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% endif %}
        {% if products %}
            <table>
                <tr>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                </tr>
                <tbody>
                    {% for p in products %}
                        <tr>
                            <td>{{ p.name }}</td>
                            <td>{{ p.category }}</td>
                            <td>{{ p.price }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table> 
        {% elseif %}
            {% if not error %}
                <p>No products found.</p>
            {% endif %}
        {% endif %}
    </body>
</html>
